name: Build and check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android tools
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content app/build.gradle.kts -Raw), 'versionName\s*=\s*"([^"]+)"').Groups[1].Value
          if($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and versionName differ' }
      - name: Build, tests and lint
        if: "!startsWith(github.ref, 'refs/tags/')"
        shell: pwsh
        run: ./gradlew.bat testDebugUnitTest lintRelease assembleRelease
      - name: Restore release signing key
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.USBDROID_KEYSTORE_BASE64 }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) { throw 'Release signing key is not configured' }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/usbdroid-release.jks", [Convert]::FromBase64String($env:KEYSTORE_BASE64))
      - name: Build signed release, tests and lint
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          USBDROID_STORE_FILE: ${{ runner.temp }}/usbdroid-release.jks
          USBDROID_STORE_PASSWORD: ${{ secrets.USBDROID_STORE_PASSWORD }}
          USBDROID_KEY_ALIAS: ${{ secrets.USBDROID_KEY_ALIAS }}
          USBDROID_KEY_PASSWORD: ${{ secrets.USBDROID_KEY_PASSWORD }}
        run: ./gradlew.bat testDebugUnitTest lintRelease assembleRelease
      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content app/build.gradle.kts -Raw), 'versionName\s*=\s*"([^"]+)"').Groups[1].Value
          New-Item -ItemType Directory -Path release-assets | Out-Null
          $apk = "release-assets/USBDroid-$version.apk"
          Copy-Item -LiteralPath app/build/outputs/apk/release/app-release.apk -Destination $apk
          $hash = (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$pwd/release-assets/SHA256SUMS", "$hash  USBDroid-$version.apk`n", [Text.UTF8Encoding]::new($false))
          & "$env:ANDROID_HOME/build-tools/35.0.0/apksigner.bat" verify --verbose $apk
          if($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-assets
          path: release-assets/
      - name: Remove signing key
        if: always() && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP/usbdroid-release.jks" -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-results
          path: |
            app/build/reports/
            app/build/outputs/apk/release/*unsigned.apk
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/*.apk release-assets/SHA256SUMS --verify-tag --title "$RELEASE_TAG" --notes "First release of USBDroid. USB image hosting, image creation and formatting, downloads, and OTA updates through GitHub Releases."
